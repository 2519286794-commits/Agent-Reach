
name: Auto Sync Fork

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/kkk-bot/HowToGetAlong.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin HEAD:main
  
